<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main">
    <div class="page">
      <header class="page-header">
        {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
      </header>

      <div class="prose">
        {{ content }}
      </div>

      <p class="back-link"><a href="{{ '/' | relative_url }}">← Back to home</a></p>
    </div>
  </main>
  {% include foot.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
